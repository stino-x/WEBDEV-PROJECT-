<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="100" height="50" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500&amp;family=Montserrat:wght@300&amp;display=swap');
        .main-text {
            font-family: 'Cinzel', serif;
            font-size: 72px;
            letter-spacing: 8px;
            dominant-baseline: middle;
        }
        .tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            letter-spacing: 10px;
            dominant-baseline: middle;
        }
    </style>

    <!-- Subtle musical note background element -->
    <path d="M145 30 Q155 25, 155 35 L155 65 Q155 75, 165 75 Q175 75, 175 65 Q175 55, 165 55 L155 55" fill="none" stroke="#2a2a2a" stroke-width="1.5" opacity="0.15"/>

    <!-- Main text group with subtle shadow -->
    <g>
        <text x="150" y="60" text-anchor="middle" class="main-text" fill="#1a1a1a">
            HYMN
        </text>
    </g>

    <!-- Tagline -->
    <text x="150" y="90" text-anchor="middle" class="tagline" fill="#4a4a4a">
        MUSIC
    </text>
</svg>